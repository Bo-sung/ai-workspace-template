version: 1

defaults:
  timeout_sec: 240
  num_ctx: 4096
  temperature: 0.2
  keep_alive: 0

workers:
  - id: laptop-gemma-e2b
    enabled: true
    host: 8eh1ndy0u.iptime.org
    user: user-pc
    port: 2224
    os: linux  # WSL2 Ubuntu (Windows OpenSSH default shell → bash.exe)
    transport: ssh
    runtime: ollama
    python_cmd: python3
    ollama_url: http://127.0.0.1:11434
    models:
      - name: gemma4:e2b
        tags: [local, light, docs, qa, summary, vision, fast]
        max_input_tokens: 1500
        max_output_tokens: 500
        priority: 20

  - id: macmini-worker
    enabled: true
    host: 8eh1ndy0u.iptime.org
    user: boseong
    port: 2222
    os: macos
    transport: ssh
    runtime: ollama
    python_cmd: python3
    ollama_url: http://127.0.0.1:11434
    models:
      - name: exaone3.5:7.8b
        tags: [local, korean, docs, planning, meeting, release-notes]
        requires_permission: true  # Non-Commercial License
        max_input_tokens: 4000
        max_output_tokens: 1000
        priority: 10
      - name: qwen3:4b
        tags: [local, light, classify, git, summary]
        max_input_tokens: 2000
        max_output_tokens: 600
        priority: 15
      - name: qwen3:8b
        tags: [local, docs, planning, qa, issue-draft]
        max_input_tokens: 4000
        max_output_tokens: 1000
        priority: 12

policies:
  exaone_session_approval: true   # true = 세션 단위 사전 승인 (ask.py가 자동 적용)
                                  # false = --user-approved 명시 필수, 없으면 거부
